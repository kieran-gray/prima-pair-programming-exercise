[project]
name = "prima"
version = "0.1.0"
description = "Prima pair programming coding test"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mypy>=1.15.0",
    "pytest-asyncio>=0.26.0",
    "pytest>=8.3.5",
    "ruff>=0.11.5",
    "asyncio>=3.4.3",
    "coverage>=7.8.0",
    "pytest-cov>=6.1.1",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.coverage.report]
fail_under = 100
show_missing = true